<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menú | La Casa de AWII</title>
<style>
  :root{
    --navy: #211d5e;
    --navy-deep: #17153f;
    --gold: #f4b93f;
    --teal: #2fa89f;
    --pink: #e94f8a;
    --cream: #fbeed9;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100dvh;
    background: var(--navy-deep);
    color: var(--cream);
    font-family: Georgia, 'Iowan Old Style', serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---- Cinta superior compacta ---- */
  header.ribbon{
    width:100%;
    background: linear-gradient(90deg, var(--navy) 0%, #2a2568 100%);
    border-bottom: 2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    gap: .9rem;
    padding: .6rem 1rem;
  }
  header.ribbon img{
    width: 44px;
    height: 44px;
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--gold);
    flex-shrink:0;
  }
  header.ribbon .text{
    text-align:left;
    line-height:1.15;
  }
  header.ribbon .eyebrow{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: .62rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color: var(--teal);
  }
  header.ribbon h1{
    margin:0;
    font-size: 1.15rem;
    font-weight:400;
    color: var(--gold);
  }
  header.ribbon .sub{
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: .68rem;
    color: var(--cream);
    opacity:.7;
  }

  main{
    width:100%;
    max-width: 460px;
    padding: 1.6rem 6vw 2rem;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---- Tarjeta de acciones del menú (protagonista) ---- */
  .card{
    width:100%;
    background: linear-gradient(160deg, #2a2568 0%, #201c58 100%);
    border: 1px solid rgba(244,185,63,.35);
    border-radius: 18px;
    padding: 1.9rem 1.5rem;
    text-align:center;
    box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .card .icon{ font-size: 2rem; margin-bottom: .4rem; }

  a.btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.5rem;
    margin-top: 1.1rem;
    text-decoration:none;
    padding: .95rem 1.2rem;
    border-radius: 999px;
    font-size: .95rem;
    font-weight: 600;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    transition: transform .15s ease;
  }
  a.btn:active{ transform: scale(.97); }
  a.btn.primary{ background: var(--gold); color: var(--navy-deep); }
  a.btn.secondary{
    background: transparent;
    color: var(--cream);
    opacity:.85;
    border: 1px solid rgba(255,255,255,.2);
    font-weight: 500;
  }
  a.btn.whatsapp{ background: #25D366; color: #0b3d24; }
  a.btn.whatsapp svg{ width:18px; height:18px; flex-shrink:0; }

  .divider{
    display:flex;
    align-items:center;
    gap:.6rem;
    margin: 1.3rem 0 .1rem;
    color: rgba(255,255,255,.35);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: .66rem;
    text-transform:uppercase;
    letter-spacing:.15em;
  }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background: rgba(255,255,255,.15); }

  /* ---- Carrusel compacto, discreto ---- */
  .carousel{
    width:100%;
    margin-top: 1.6rem;
    position:relative;
    border-radius: 14px;
    overflow:hidden;
    height: 210px;
    box-shadow: 0 10px 26px rgba(0,0,0,.35);
    border: 1px solid rgba(244,185,63,.2);
  }
  .carousel .slide{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:.3rem;
    opacity:0;
    transition: opacity .7s ease;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .carousel .slide.active{ opacity:1; }
  .carousel .slide img{
    width:100%; height:100%; object-fit:cover; position:absolute; inset:0;
  }
  .carousel .slide .caption{
    position:relative;
    z-index:2;
    background: rgba(23,21,63,.55);
    padding: .25rem .7rem;
    border-radius: 999px;
    font-size: .68rem;
    letter-spacing:.04em;
  }
  .carousel .dots{
    position:absolute;
    bottom: 8px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap: .35rem;
    z-index:3;
  }
  .carousel .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: rgba(255,255,255,.4);
    cursor:pointer;
    transition: background .2s ease;
  }
  .carousel .dot.active{ background: var(--gold); }

  footer{
    margin-top: 2.4rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: .7rem;
    color: rgba(251,238,217,.45);
    text-align:center;
    padding-bottom: 1rem;
  }
</style>
</head>
<body>

  <header class="ribbon">
    <img src="logo.png" alt="La Casa de AWII">
    <div class="text">
      <div class="eyebrow">Bienvenido a</div>
      <h1>La Casa de AWII</h1>
      <div class="sub">Escanea, mira y disfruta nuestro menú</div>
    </div>
  </header>

  <main>
    <h2 style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: .95rem; font-weight: 600; letter-spacing: .02em; color: var(--gold); text-align: center; margin: 0 0 .8rem;">Eventos y Promociones Que Tenemos Para Ti</h2>

    <!--
      CARRUSEL: las imágenes deben llamarse img1.jpg, img2.jpg, img3.jpg
      y estar en la raíz del repositorio junto a index.html.
      Puedes agregar más <div class="slide"><img ...></div> siguiendo el mismo patrón.
    -->
    <div class="carousel" id="carousel">
      <div class="slide active">
        <img src="img1.jpg" alt="La Casa de AWII - foto 1">
      </div>
      <div class="slide">
        <img src="img2.jpg" alt="La Casa de AWII - foto 2">
      </div>
      <div class="slide">
        <img src="img3.jpg" alt="La Casa de AWII - foto 3">
      </div>
      <div class="dots">
        <span class="dot active" data-i="0"></span>
        <span class="dot" data-i="1"></span>
        <span class="dot" data-i="2"></span>
      </div>
    </div>

    <div class="card" style="margin-top: 1.6rem;">
      <div class="icon">🍽️</div>
      <a class="btn primary" href="menu.pdf" target="_blank" rel="noopener">Ver el menú</a>
      <a class="btn secondary" id="downloadBtn" href="menu.pdf">Descargar PDF</a>

      <div class="divider">o si prefieres</div>

      <a class="btn whatsapp" href="https://wa.me/527775071475?text=Hola%20Casa%20Awii%2C%20deseo%20hacer%20un%20pedido%20por%20favor" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.28-1.38a9.9 9.9 0 0 0 4.76 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.03c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.81-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.79-4.17-4.94-4.36-.14-.2-1.18-1.57-1.18-3 0-1.43.75-2.13 1.02-2.42.27-.29.58-.36.78-.36.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.15.12.32.02.51-.1.2-.15.32-.29.49-.15.17-.31.38-.44.51-.15.15-.3.31-.13.6.17.29.75 1.24 1.62 2.01 1.11.99 2.05 1.3 2.34 1.45.29.15.46.13.63-.08.17-.2.72-.84.92-1.13.19-.29.39-.24.65-.15.27.1 1.7.8 1.99.95.29.15.48.22.55.34.07.13.07.75-.17 1.43Z"/></svg>
        Pide Por WhatsApp y Pasa Por tu Pedido
      </a>
    </div>

    <footer>© 2026 La Casa de AWII. Todos los derechos reservados.</footer>
  </main>

  <script>
    (function(){
      const slides = document.querySelectorAll('#carousel .slide');
      const dots = document.querySelectorAll('#carousel .dot');
      let i = 0;
      let timer;

      function show(n){
        slides.forEach(s => s.classList.remove('active'));
        dots.forEach(d => d.classList.remove('active'));
        slides[n].classList.add('active');
        dots[n].classList.add('active');
        i = n;
      }
      function next(){ show((i + 1) % slides.length); }
      function start(){ timer = setInterval(next, 6000); }
      function reset(){ clearInterval(timer); start(); }

      dots.forEach(d => d.addEventListener('click', () => {
        show(parseInt(d.dataset.i, 10));
        reset();
      }));

      start();
    })();

    // Descarga forzada del PDF (algunos navegadores ignoran el
    // atributo download y abren el visor interno de PDF en su lugar).
    document.getElementById('downloadBtn').addEventListener('click', function(e){
      e.preventDefault();
      const url = this.getAttribute('href');
      fetch(url)
        .then(res => res.blob())
        .then(blob => {
          const blobUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = 'Menu Casa Awii.pdf';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
        })
        .catch(() => { window.open(url, '_blank'); });
    });
  </script>

</body>
</html>
